name: Feature request
description: Something the Sandbox, the Workbench or CaQL should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first; add to one that already asks for this.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Sandbox - single participant
        - Sandbox - LocalNetND
        - Workbench
        - CaQL
        - Installation (FIRST_INSTALL.md)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion, request or idea
  - type: textarea
    id: supporting-docs
    attributes:
      label: Supporting docs
      description: Links, or drag files in.

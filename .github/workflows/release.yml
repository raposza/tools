#
# Builds the two application jars when a Release is PUBLISHED and attaches
# them to it, with their SHA-256 digests. A draft Release triggers nothing.
# The workflow that runs is the one in the tagged commit.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # EVERY ACTION BY COMMIT, NEVER BY TAG. A tag can be moved to other code;
      # a commit cannot. The comment names the release the commit was, read
      # 2026-10-05 - the same commits v7 and v6 pointed at that day.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # THE MAVEN THE WORKSTATION RUNS, not whichever one the runner image
      # carries. The SHA-512 is Apache's, published beside the download, and
      # it matched the bytes Maven Central serves for the same distribution on
      # 2026-10-05. A mismatch stops the release here.
      - name: Maven 3.8.7, checked against its SHA-512
        env:
          MVN_VER: 3.8.7
          MVN_SHA512: 21c2be0a180a326353e8f6d12289f74bc7cd53080305f05358936f3a1b6dd4d91203f4cc799e81761cf5c53c5bbe9dcc13bdb27ec8f57ecf21b2f9ceec3c8d27
        run: |
          f="$RUNNER_TEMP/apache-maven-$MVN_VER-bin.tar.gz"
          curl -fsSL -o "$f" "https://archive.apache.org/dist/maven/maven-3/$MVN_VER/binaries/apache-maven-$MVN_VER-bin.tar.gz"
          echo "$MVN_SHA512  $f" | sha512sum -c -
          tar -xzf "$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VER/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-$MVN_VER/bin/mvn" -v | head -1 | grep -F "Apache Maven $MVN_VER "
      - name: the tag names the pom version
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$v" = "$TAG" || { echo "tag $TAG, pom $v"; exit 1; }
      - name: build and test, the release gate
        run: bash ./test.sh
      - name: collect the jars and their digests
        run: |
          mkdir dist
          cp apps/sandbox/target/sandbox-*-app.jar apps/workbench/target/workbench-*-app.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber dist/*
